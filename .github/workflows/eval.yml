name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redteam-desk
        uses: actions/checkout@v4
        with:
          path: redteam-desk

      # Companion project: supplies the labeled synthetic corpus the eval is
      # scored against. Checked out as a sibling directory (matching the
      # layout redteam-desk's eval/eval.py and run_demo.py expect). Pin `ref`
      # to a specific tag/commit once synth-corpus cuts a release, for a
      # fully reproducible CI run.
      - name: Checkout synth-corpus (companion repo, sibling checkout)
        uses: actions/checkout@v4
        with:
          repository: trentmilam/synth-corpus
          ref: main
          path: synth-corpus

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pytest

      - name: Run the zero-dependency detector test suite
        working-directory: redteam-desk
        run: python -m pytest tests/ -v

      - name: Run the full eval against synth-corpus's labeled ground truth
        working-directory: redteam-desk
        run: python eval/eval.py
