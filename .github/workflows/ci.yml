name: CI

on:
  push:
  pull_request:

jobs:
  eval-and-demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable)
        run: pip install -e . pytest

      - name: Run eval.py and verify the README's claimed numbers
        run: |
          set -o pipefail   # else the exit status is tee's, and a FAILING command below stays green
          python eval/eval.py | tee eval_output.txt
          grep -q "RESULT: PASS" eval_output.txt
          grep -q "(36/36 checks)" eval_output.txt
          grep -q "precision gap (worldfree - naive): 0.636" eval_output.txt

      - name: Run run_demo.py
        run: |
          set -o pipefail   # else the exit status is tee's, and a FAILING command below stays green
          python run_demo.py | tee demo_output.txt
          grep -q "CLEAN corpus" demo_output.txt
          grep -q "FLAWED corpus" demo_output.txt

      # The checker that is scored against this corpus lives here too, so it is
      # exercised on the same run rather than in a separate repo that checked this
      # one out at a pinned tag. grep the headline numbers so a silent regression
      # to 0 findings cannot pass as green.
      - name: Run the red-team eval against the generated corpus
        run: |
          set -o pipefail   # else the exit status is tee's, and a FAILING command below stays green
          python eval/eval_redteam.py | tee redteam_output.txt
          grep -q "RESULT: PASS" redteam_output.txt
          grep -q "recall=1.000  precision=1.000" redteam_output.txt

      - name: Run run_redteam_demo.py
        run: |
          set -o pipefail   # else the exit status is tee's, and a FAILING command below stays green
          python run_redteam_demo.py | tee redteam_demo.txt
          grep -q "Score vs answer key" redteam_demo.txt

      - name: Fail if the README's head-to-head table drifted from the eval
        run: python scripts/check_readme_numbers.py

      - name: Run pytest suite
        run: pytest -q
